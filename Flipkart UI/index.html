<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flipkart UI</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    </head>
    <body>
       <div id="main">

            <div id="header">
                <div id="header1">
                    <div id="fliplogo">
                        <img src="https://rukminim2.flixcart.com/fk-p-flap/52/44/image/d2ecfddf891a3922.png?q=60" alt="">
                        <div id="flipkart"><p>Flipkart</p></div>
                    </div>

                    <div id="travellogo">
                        <img src="https://rukminim2.flixcart.com/fk-p-flap/58/44/image/7ab4040af860941d.png?q=60" alt="">
                        <div id="travel"><p>Travel</p></div>
                    </div>

                    <div id="location">
                        <i class="ri-map-pin-line"></i>
                        <p><b>Location not set</b></p>
                        <p id="delivery">Select Delivery Location</p>
                        <i class="ri-arrow-right-s-line"></i>
                    </div>
                </div>

                <div id="header2">
                    <div id="searchbox">
                        <i class="ri-search-line"></i>
                        <input id="text" type="text" placeholder="Search for products,Brands and More">
                    </div>
                    <div class="lmc" id="login">
                        <i class="ri-user-line"></i>
                        <p>Login</p>
                        <i class="ri-arrow-down-s-line"></i>
                    </div>
                    <div class="lmc" id="more">
                        <p>More</p>
                        <i class="ri-arrow-down-s-line"></i>
                    </div>
                    <div class="lmc" id="cart">
                        <i class="ri-shopping-cart-line"></i>
                        <p>Cart</p>
                    </div>
                </div>

            </div>
         
            <div id="fakeheader"></div>

            <div id="page1">
                <div id="category">
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/all.svg" alt="">
                        <p>For You</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/fashion.svg" alt="">
                        <p>Fashion</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/mobiles.svg" alt="">
                        <p>Mobiles</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/electronics.svg" alt="">
                        <p>Electronics</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/beauty.svg" alt="">
                        <p>Beauty</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/home-final.svg" alt="">
                        <p>Home</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/tv.svg" alt="">
                        <p>Appliances</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/toy.svg" alt="">
                        <p>Toys</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/furniture.svg" alt="">
                        <p>Furniture</p>
                    </div>
                    <div class="product">
                        <img src="https://static-assets-web.flixcart.com/apex-static/images/svgs/L1Nav/books.svg" alt="">
                        <p>Books</p>
                    </div>

                    
                </div>

                <div id="deals">
                    <div id="img1">
                       <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/1312x640-19f82h-1790337578913.png?q=60" alt="">
                    </div>

                    <div id="img2">
                        <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/1312x640-19f82h-1790516385783.png?q=60" alt="">

                    <div id="img2a">

                </div>

                <div id="deals2">
                    <div id="img3">
                        <img src="https://rukminim1.flixcart.com/fk-p-flap/1600/2140/image/d7ae398cc76ee728.png?q=60" alt="">
                    </div>
                    <div id="img4">

                <div id="Fashion">
                    <div id="container">
                        <div class="box" id="box1">
